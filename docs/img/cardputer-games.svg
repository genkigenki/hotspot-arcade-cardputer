<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" width="480" height="270" font-family="'DejaVu Sans Mono','Courier New',monospace" shape-rendering="crispEdges">
  <rect width="240" height="135" fill="#0B0B0C"/>

  <!-- header -->
  <rect x="0" y="0" width="240" height="12" fill="#FF8200"/>
  <text x="3" y="9" font-size="8" fill="#0B0B0C" font-weight="bold">SELECT GAME</text>

  <!-- game list: active in orange (*), selected row on an orange bar, 1v1 tags orange -->
  <text x="4" y="26" font-size="10" fill="#FF8200">*Trivia</text>
  <text x="4" y="42" font-size="10" fill="#F2F2EE">Would You Rather</text>
  <text x="4" y="58" font-size="10" fill="#F2F2EE">Word Scramble</text>
  <text x="4" y="74" font-size="10" fill="#F2F2EE">Spectrum</text>

  <rect x="0" y="79" width="240" height="15" fill="#FF8200"/>
  <text x="4" y="90" font-size="10" fill="#0B0B0C">Kiss Marry Kill</text>

  <text x="4" y="106" font-size="10" fill="#F2F2EE">Connect Four</text>
  <text x="238" y="106" font-size="8" fill="#FF8200" text-anchor="end">1v1</text>

  <!-- selected game's description -->
  <text x="4" y="121" font-size="8" fill="#C0C0BC">Predict a player's picks</text>

  <!-- footer -->
  <rect x="0" y="124" width="240" height="11" fill="#2E2E33"/>
  <text x="3" y="132" font-size="8" fill="#F2F2EE">;/. move   ENTER pick   ESC back</text>
</svg>
