<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" width="480" height="270" font-family="'DejaVu Sans Mono','Courier New',monospace" shape-rendering="crispEdges">
  <rect width="240" height="135" fill="#0B0B0C"/>

  <!-- header bar (orange, black text) -->
  <rect x="0" y="0" width="240" height="12" fill="#FF8200"/>
  <text x="3" y="9" font-size="8" fill="#0B0B0C" font-weight="bold">HOTSPOT ARCADE</text>
  <text x="237" y="9" font-size="8" fill="#0B0B0C" text-anchor="end">87%</text>

  <!-- line 1: SSID + join URL (green = AP up) -->
  <text x="3" y="23" font-size="8" fill="#46D369">Hotspot Arcade  http://192.168.4.1</text>

  <!-- line 2: active game + players -->
  <text x="3" y="35" font-size="8" fill="#F2F2EE">Game: Trivia   Players: 6</text>

  <line x1="0" y1="40" x2="240" y2="40" stroke="#2E2E33" stroke-width="1"/>

  <!-- scoreboard, two columns; leader in orange -->
  <text x="3"   y="52" font-size="8" fill="#FF8200">1.Mia:340</text>
  <text x="123" y="52" font-size="8" fill="#F2F2EE">4.Jonas:180</text>
  <text x="3"   y="65" font-size="8" fill="#F2F2EE">2.Ben:295</text>
  <text x="123" y="65" font-size="8" fill="#F2F2EE">5.Lea:120</text>
  <text x="3"   y="78" font-size="8" fill="#F2F2EE">3.Anna:240</text>
  <text x="123" y="78" font-size="8" fill="#F2F2EE">6.Tim:90</text>

  <!-- last event (orange accent) -->
  <text x="3" y="113" font-size="8" fill="#FF8200">Lea joined</text>

  <!-- footer hint bar -->
  <rect x="0" y="124" width="240" height="11" fill="#2E2E33"/>
  <text x="3" y="132" font-size="8" fill="#F2F2EE">G game   L board   S settings   E end</text>
</svg>
